<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #f4f4f1;
    --surface: #ffffff;
    --surface2: #ecece7;
    --ink: #1d2025;
    --muted: #686c74;
    --line: #ddddd6;
    --accent: #2953a8;
    --accent-ink: #ffffff;
    --accent-soft: #e7edf9;
    --danger: #c0272d;
    --danger-soft: #f9e9e9;
    --ok: #2e7d43;
    --ok-soft: #e8f3ea;
    --stripe: #f4c530;
    --shadow: 0 1px 2px rgba(20,24,30,.06), 0 8px 24px rgba(20,24,30,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16181d;
      --surface: #1f2229;
      --surface2: #262a32;
      --ink: #e8e8e3;
      --muted: #9a9ea6;
      --line: #30343d;
      --accent: #7da3ea;
      --accent-ink: #101625;
      --accent-soft: #232d40;
      --danger: #e2606a;
      --danger-soft: #3a2226;
      --ok: #6cbd80;
      --ok-soft: #1f3226;
      --stripe: #e8bd35;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #16181d;
    --surface: #1f2229;
    --surface2: #262a32;
    --ink: #e8e8e3;
    --muted: #9a9ea6;
    --line: #30343d;
    --accent: #7da3ea;
    --accent-ink: #101625;
    --accent-soft: #232d40;
    --danger: #e2606a;
    --danger-soft: #3a2226;
    --ok: #6cbd80;
    --ok-soft: #1f3226;
    --stripe: #e8bd35;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Barlow", "IBM Plex Sans Arabic", "Segoe UI", system-ui, sans-serif;
    font-size: 16.5px;
    line-height: 1.45;
    min-height: 100vh;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 22px 16px 64px; }

  /* header */
  .top { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
  .home-btn {
    margin-inline-start: auto; flex: none;
    display: inline-flex; align-items: center; gap: 7px;
    border: 1.5px solid var(--line); background: var(--surface);
    color: var(--ink); border-radius: 999px; padding: 8px 16px;
    font-family: inherit; font-size: 14.5px; font-weight: 600;
    cursor: pointer; transition: border-color .15s, background .15s;
  }
  .home-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
  .home-btn:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
  .home-btn svg { width: 15px; height: 15px; flex: none; }
  @media (max-width: 430px) {
    .top-sub { display: none; }
    .home-btn .home-label { display: none; }
    .home-btn { padding: 9px 11px; }
  }
  .plate {
    background: #2953a8; color: #fff;
    border: 2.5px solid #fff; outline: 2px solid #2953a8;
    border-radius: 9px; padding: 5px 13px;
    font-weight: 800; letter-spacing: .08em; font-size: 19px;
    font-family: "Barlow", "IBM Plex Sans Arabic", system-ui, sans-serif;
    white-space: nowrap;
  }
  .top-sub { color: var(--muted); font-size: 14.5px; line-height: 1.3; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 26px 26px 28px;
  }
  @media (max-width: 560px) { .card { padding: 20px 16px 22px; } }

  .eyebrow {
    text-transform: uppercase; letter-spacing: .13em;
    font-size: 12px; font-weight: 700; color: var(--muted);
    margin: 0 0 10px;
  }
  [dir="rtl"] .eyebrow { letter-spacing: 0; font-size: 13.5px; }
  .section + .section { margin-top: 26px; }

  /* choice pills + cards */
  .pills { display: flex; flex-wrap: wrap; gap: 9px; }
  .pill {
    border: 1.5px solid var(--line); background: var(--surface);
    color: var(--ink); border-radius: 999px;
    padding: 9px 18px; font-size: 15.5px; font-weight: 600;
    font-family: inherit; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .pill:hover { border-color: var(--accent); }
  .pill.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .pill:focus-visible, .cat:focus-visible, .btn:focus-visible, .ans:focus-visible {
    outline: 2.5px solid var(--accent); outline-offset: 2px;
  }
  .cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 9px; }
  .cat {
    border: 1.5px solid var(--line); background: var(--surface);
    border-radius: 12px; padding: 13px 10px 11px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    cursor: pointer; font-family: inherit; color: var(--ink);
    transition: border-color .15s, background .15s;
  }
  .cat:hover { border-color: var(--accent); }
  .cat.on { border-color: var(--accent); background: var(--accent-soft); }
  .cat .glyph {
    width: 40px; height: 40px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 19px;
    background: #2953a8; color: #fff; border: 2px solid #fff; outline: 1.5px solid #2953a8;
  }
  .cat .glyph.tri {
    width: 0; height: 0; border-radius: 0; background: none; outline: none;
    border-left: 22px solid transparent; border-right: 22px solid transparent;
    border-bottom: 38px solid #c0272d; border-top: none; position: relative;
  }
  .cat .glyph.tri::after {
    content: "!"; position: absolute; top: 9px; left: -6px;
    color: #fff; font-weight: 800; font-size: 19px; line-height: 1;
  }
  .cat .cname { font-size: 14.5px; font-weight: 600; text-align: center; line-height: 1.25; }
  .cat .cnum { font-size: 12.5px; color: var(--muted); }

  .countrow { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; }
  .countrow input {
    width: 92px; padding: 9px 12px; border-radius: 999px;
    border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
    font-family: inherit; font-size: 15.5px; font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .pool { margin-top: 12px; font-size: 14px; color: var(--muted); }

  .btn {
    border: none; border-radius: 11px; padding: 13px 26px;
    font-family: inherit; font-size: 16.5px; font-weight: 700;
    cursor: pointer; transition: filter .15s, opacity .15s;
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.ghost { background: none; border: 1.5px solid var(--line); color: var(--ink); }
  .btn.ghost:hover { border-color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .startbar { margin-top: 30px; display: flex; }
  .startbar .btn { flex: 1; padding: 15px; font-size: 17.5px; }

  /* road progress */
  .road { height: 14px; border-radius: 999px; background: var(--surface2); border: 1px solid var(--line); overflow: hidden; margin-bottom: 20px; }
  .road-fill {
    height: 100%; background: #3a3f47; border-radius: 999px;
    background-image: repeating-linear-gradient(90deg, transparent 0 12px, var(--stripe) 12px 24px);
    background-size: 100% 2.5px; background-position: 0 center; background-repeat: no-repeat;
    transition: width .25s ease;
  }
  @media (prefers-reduced-motion: reduce) {
    .road-fill { transition: none; }
    .qcard { animation: none !important; }
  }

  /* quiz */
  .qmeta { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .qbadge {
    font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
    color: var(--accent); background: var(--accent-soft);
    border-radius: 6px; padding: 3px 9px;
  }
  [dir="rtl"] .qbadge { letter-spacing: 0; font-size: 13px; }
  .qnum { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .qtext { font-size: 21px; font-weight: 600; line-height: 1.35; margin: 6px 0 18px; text-wrap: balance; }
  .qsign { display: flex; justify-content: center; margin: 4px 0 20px; }
  .qsign img {
    max-height: 150px; max-width: 100%; border-radius: 10px;
    background: #fff; padding: 8px; border: 1px solid var(--line);
  }
  .anss { display: flex; flex-direction: column; gap: 10px; }
  .ans {
    display: flex; align-items: center; gap: 13px;
    text-align: start; width: 100%;
    border: 1.5px solid var(--line); background: var(--surface);
    color: var(--ink); border-radius: 11px; padding: 13px 15px;
    font-family: inherit; font-size: 16.5px; line-height: 1.4; cursor: pointer;
    transition: border-color .12s, background .12s;
  }
  .ans:hover { border-color: var(--accent); }
  .ans.on { border-color: var(--accent); background: var(--accent-soft); }
  .ans .key {
    flex: none; width: 27px; height: 27px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700;
    background: var(--surface2); color: var(--muted); border: 1px solid var(--line);
  }
  .ans.on .key { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .navrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 24px; }
  .navrow .mid { color: var(--muted); font-size: 13.5px; font-variant-numeric: tabular-nums; }
  .qcard { animation: qin .22s ease; }
  @keyframes qin { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }

  /* results */
  .scorehead { text-align: center; padding: 8px 0 4px; }
  .scorebig { font-size: 56px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .scorepct { color: var(--muted); font-size: 18px; margin-top: 6px; }
  .verdict {
    display: inline-block; margin-top: 14px; border-radius: 999px;
    padding: 7px 18px; font-weight: 700; font-size: 15px;
  }
  .verdict.pass { background: var(--ok-soft); color: var(--ok); }
  .verdict.fail { background: var(--danger-soft); color: var(--danger); }
  .passnote { margin-top: 10px; font-size: 13px; color: var(--muted); }
  .typegrid { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; margin-top: 20px; }
  .typechip {
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px;
    font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .typechip b { color: var(--ink); }
  .resbtns { display: flex; gap: 10px; justify-content: center; margin-top: 26px; flex-wrap: wrap; }

  .rev { margin-top: 34px; }
  .revitem {
    border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface); padding: 16px 17px; margin-top: 12px;
  }
  .revitem.wrong { border-inline-start: 4px solid var(--danger); }
  .revitem.right { border-inline-start: 4px solid var(--ok); }
  .revq { font-weight: 600; margin: 4px 0 10px; }
  .revsign img { max-height: 100px; border-radius: 8px; background: #fff; padding: 5px; border: 1px solid var(--line); margin-bottom: 10px; }
  .reva { display: flex; gap: 9px; align-items: baseline; padding: 5px 0; font-size: 15.5px; }
  .reva .mark { flex: none; width: 20px; text-align: center; font-weight: 800; }
  .reva.correct { color: var(--ok); font-weight: 600; }
  .reva.chosen-wrong { color: var(--danger); }
  .reva.plain { color: var(--muted); }
  .hidden { display: none !important; }
  footer { margin-top: 34px; text-align: center; color: var(--muted); font-size: 13px; }
</style>

<div class="wrap" id="app">
  <div class="top">
    <div class="plate">PERMIS&nbsp;LB</div>
    <div class="top-sub" id="tagline"></div>
    <button class="home-btn hidden" id="homebtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

        <path d="M5.5 9.5V20h13V9.5"></path>
      </svg>
      <span class="home-label"></span>
    </button>

  <!-- START -->
  <div id="screen-start" class="card">
    <div class="section">
      <p class="eyebrow" id="l-lang"></p>
      <div class="pills" id="langpills"></div>
    </div>
    <div class="section">
      <p class="eyebrow" id="l-cat"></p>
      <div class="cats" id="catcards"></div>
    </div>
    <div class="section">
      <p class="eyebrow" id="l-count"></p>
      <div class="countrow" id="countrow"></div>
      <div class="pool" id="pool"></div>
    </div>
    <div class="startbar">
      <button class="btn primary" id="startbtn"></button>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="screen-quiz" class="hidden">
    <div class="road"><div class="road-fill" id="roadfill" style="width:0%"></div></div>

      <div class="qmeta">
        <span class="qbadge" id="qbadge"></span>
        <span class="qnum" id="qnum"></span>
      </div>
      <div class="qtext" id="qtext"></div>
      <div class="qsign hidden" id="qsign"><img id="qsignimg" alt=""></div>
      <div class="anss" id="anss"></div>
      <div class="navrow">
        <button class="btn ghost" id="prevbtn"></button>
        <span class="mid" id="answeredcount"></span>
        <button class="btn primary" id="nextbtn"></button>
      </div>
    </div>
  </div>

  <!-- RESULT -->
  <div id="screen-result" class="hidden">
    <div class="card">
      <div class="scorehead">
        <p class="eyebrow" id="l-score"></p>
        <div class="scorebig" id="scorebig"></div>
        <div class="scorepct" id="scorepct"></div>
        <div><span class="verdict" id="verdict"></span></div>
        <div class="passnote" id="passnote"></div>
        <div class="typegrid" id="typegrid"></div>
        <div class="resbtns">
          <button class="btn primary" id="againbtn"></button>
        </div>
      </div>
      <div class="rev">
        <p class="eyebrow" id="l-review"></p>
        <div id="revlist"></div>
      </div>
    </div>
  </div>

  <footer id="foot"></footer>
</div>

      lang: "لغة الامتحان", cat: "فئة الرخصة", count: "عدد الأسئلة",
      custom: "آخر", start: "ابدأ الامتحان", pool: "{n} سؤالاً متاحاً في هذه الفئة",
      badge: { safety: "سلامة", law: "قانون", signs: "إشارة سير", ed: "قيادة اقتصادية" },
      cats: { car: "سيارة (B)", moto: "دراجة نارية (A)", truck: "شاحنة (C)", signs: "إشارات السير", all: "الكل" },
      qnum: "السؤال {i} من {n}", answered: "تمت الإجابة على {a}/{n}",
      prev: "السابق", next: "التالي", finish: "إنهاء الامتحان",
      confirmFinish: "بعض الأسئلة بدون إجابة. هل تريد الإنهاء؟",
      score: "نتيجتك", pct: "{p}% إجابات صحيحة",
      pass: "نتيجة نجاح", fail: "دون مستوى النجاح",
      passnote: "اعتُمدت نسبة 80% هنا كحدّ نجاح استرشادي — قد يختلف الحدّ الرسمي.",
      review: "التصحيح", again: "امتحان جديد",
      your: "إجابتك", correct: "الإجابة الصحيحة", skipped: "بدون إجابة",
      home: "الرئيسية", confirmHome: "هل تريد مغادرة الامتحان؟ ستفقد إجاباتك.",
      foot: "أُنشئ من ملف PDF الرسمي لبنك أسئلة الامتحان النظري."
    }
  };

  var state = {
    lang: "en", cat: "car", count: 20,
    exam: [], answers: [], idx: 0
  };

  function t(key) {
    var parts = key.split("."); var cur = UI[state.lang];
    for (var i = 0; i < parts.length; i++) cur = cur[parts[i]];
    return cur;
  }
  function fmt(s, o) { return s.replace(/\{(\w+)\}/g, function (_, k) { return o[k]; }); }
  function el(id) { return document.getElementById(id); }

  function norm(s) { return (s || "").trim().toLowerCase(); }
  function typeKey(q) {
    var ty = norm(q.qtype);
    if (ty.indexOf("sign") === 0) return "signs";
    if (ty === "law") return "law";
    if (ty === "ed") return "ed";
    return "safety";
  }
  function inCat(q, cat) {
    var c = norm(q.cat);
    if (cat === "all") return true;
    if (cat === "signs") return typeKey(q) === "signs";
    if (cat === "car") return c === "g" || c === "bc";
    if (cat === "moto") return c === "a" || c === "g";
    if (cat === "truck") return c === "c" || c === "bc" || c === "g";
    return true;
  }
  function poolFor(lang, cat) {
    return (BANK[lang] || []).filter(function (q) {
      return q.answers && q.answers.length === 3 && q.question && inCat(q, cat);
    });
  }
  function signSrc(q) {
    if (!q.sign_image) return null;
    var n = parseInt(q.sign_image, 10);
    return SIGNS[String(n)] || null;
  }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  var COUNTS = [10, 20, 30, 50];
  var CATS = ["car", "moto", "truck", "signs", "all"];

  function showHome() {
    var b = el("homebtn");
    b.classList.remove("hidden");
    b.querySelector(".home-label").textContent = t("home");
    b.setAttribute("aria-label", t("home"));
    b.title = t("home");
  }

  function goHome() {
    var quizOpen = !el("screen-quiz").classList.contains("hidden");
    var started = state.answers.some(function (x) { return x !== null; });
    if (quizOpen && started && !window.confirm(t("confirmHome"))) return;
    state.exam = []; state.answers = []; state.idx = 0;
    el("screen-quiz").classList.add("hidden");
    el("screen-result").classList.add("hidden");
    el("screen-start").classList.remove("hidden");
    renderStart();
    window.scrollTo({ top: 0 });
  }

  function renderStart() {
    document.documentElement.dir = state.lang === "ar" ? "rtl" : "ltr";
    document.documentElement.lang = state.lang;
    el("homebtn").classList.add("hidden");
    el("tagline").textContent = t("tagline");
    el("l-lang").textContent = t("lang");
    el("l-cat").textContent = t("cat");
    el("l-count").textContent = t("count");
    el("startbtn").textContent = t("start");
    el("foot").textContent = t("foot");

    var lp = el("langpills"); lp.innerHTML = "";
    [["en", "English"], ["fr", "Français"], ["ar", "العربية"]].forEach(function (L) {
      var b = document.createElement("button");
      b.className = "pill" + (state.lang === L[0] ? " on" : "");
      b.textContent = L[1];
      b.onclick = function () { state.lang = L[0]; renderStart(); };
      lp.appendChild(b);
    });

    var cc = el("catcards"); cc.innerHTML = "";
    CATS.forEach(function (c) {
      var n = poolFor(state.lang, c).length;
      var b = document.createElement("button");
      b.className = "cat" + (state.cat === c ? " on" : "");
      var glyph;
      if (c === "signs") { glyph = '<span class="glyph tri"></span>'; }
      else {
        var letter = c === "car" ? "B" : c === "moto" ? "A" : c === "truck" ? "C" : "∗";
        glyph = '<span class="glyph">' + letter + "</span>";
      }
      b.innerHTML = glyph + '<span class="cname">' + t("cats." + c) + '</span><span class="cnum">' + n + "</span>";
      b.setAttribute("aria-label", t("cats." + c) + " — " + n);
      b.setAttribute("aria-pressed", state.cat === c ? "true" : "false");
      b.onclick = function () { state.cat = c; renderStart(); };
      cc.appendChild(b);
    });

    var pool = poolFor(state.lang, state.cat);
    var cr = el("countrow"); cr.innerHTML = "";
    COUNTS.forEach(function (n) {
      var b = document.createElement("button");
      b.className = "pill" + (state.count === n ? " on" : "");
      b.textContent = n;
      b.disabled = n > pool.length;
      if (b.disabled) b.style.opacity = ".4";
      b.onclick = function () { state.count = n; renderStart(); };
      cr.appendChild(b);
    });
    var inp = document.createElement("input");
    inp.type = "number"; inp.min = "1"; inp.max = String(pool.length);
    inp.placeholder = t("custom");
    if (COUNTS.indexOf(state.count) === -1) inp.value = state.count;
    inp.onchange = function () {
      var v = parseInt(inp.value, 10);
      if (v >= 1) { state.count = Math.min(v, pool.length); renderStart(); }
    };
    cr.appendChild(inp);
    el("pool").textContent = fmt(t("pool"), { n: pool.length });
    el("startbtn").disabled = pool.length === 0;
  }

  function startExam() {
    var pool = poolFor(state.lang, state.cat);
    var n = Math.min(state.count, pool.length);
    var picked = shuffle(pool.slice()).slice(0, n);
    state.exam = picked.map(function (q) {
      var order = shuffle([0, 1, 2]);
      return {
        q: q,
        answers: order.map(function (i) { return q.answers[i]; }),
        correct: order.indexOf(q.correct)
      };
    });
    state.answers = new Array(n).fill(null);
    state.idx = 0;
    el("screen-start").classList.add("hidden");
    el("screen-result").classList.add("hidden");
    el("screen-quiz").classList.remove("hidden");
    showHome();
    renderQ();
  }

  function renderQ() {
    var n = state.exam.length, i = state.idx, item = state.exam[i];
    var card = el("qcard");
    card.style.animation = "none"; void card.offsetWidth; card.style.animation = "";
    el("roadfill").style.width = ((i + 1) / n * 100) + "%";
    el("qbadge").textContent = t("badge." + typeKey(item.q));
    el("qnum").textContent = fmt(t("qnum"), { i: i + 1, n: n });
    el("qtext").textContent = item.q.question;
    var src = signSrc(item.q);
    if (src) { el("qsignimg").src = src; el("qsign").classList.remove("hidden"); }
    else { el("qsign").classList.add("hidden"); }

    var box = el("anss"); box.innerHTML = "";
    item.answers.forEach(function (a, k) {
      var b = document.createElement("button");
      b.className = "ans" + (state.answers[i] === k ? " on" : "");
      b.innerHTML = '<span class="key">' + (k + 1) + "</span><span></span>";
      b.lastChild.textContent = a;
      b.setAttribute("aria-pressed", state.answers[i] === k ? "true" : "false");
      b.onclick = function () { state.answers[i] = k; renderQ(); };
      box.appendChild(b);
    });

    var answered = state.answers.filter(function (x) { return x !== null; }).length;
    el("answeredcount").textContent = fmt(t("answered"), { a: answered, n: n });
    el("prevbtn").textContent = t("prev");
    el("prevbtn").disabled = i === 0;
    el("nextbtn").textContent = i === n - 1 ? t("finish") : t("next");
  }

  function next() {
    var n = state.exam.length;
    if (state.idx < n - 1) { state.idx++; renderQ(); return; }
    var unanswered = state.answers.some(function (x) { return x === null; });
    if (unanswered && !window.confirm(t("confirmFinish"))) return;
    finish();
  }

  function finish() {
    var n = state.exam.length, right = 0;
    var byType = {};
    state.exam.forEach(function (item, i) {
      var ok = state.answers[i] === item.correct;
      if (ok) right++;
      var k = typeKey(item.q);
      byType[k] = byType[k] || { ok: 0, n: 0 };
      byType[k].n++; if (ok) byType[k].ok++;
    });
    var pct = Math.round(right / n * 100);
    el("screen-quiz").classList.add("hidden");
    el("screen-result").classList.remove("hidden");
    showHome();
    el("l-score").textContent = t("score");
    el("scorebig").textContent = right + " / " + n;
    el("scorepct").textContent = fmt(t("pct"), { p: pct });
    var v = el("verdict");
    v.className = "verdict " + (pct >= 80 ? "pass" : "fail");
    v.textContent = pct >= 80 ? t("pass") : t("fail");
    el("passnote").textContent = t("passnote");
    el("againbtn").textContent = t("again");
    el("l-review").textContent = t("review");

    var tg = el("typegrid"); tg.innerHTML = "";
    Object.keys(byType).forEach(function (k) {
      var s = document.createElement("span");
      s.className = "typechip";
      s.innerHTML = "<b>" + byType[k].ok + "/" + byType[k].n + "</b> · " + t("badge." + k);
      tg.appendChild(s);
    });

    var rl = el("revlist"); rl.innerHTML = "";
    state.exam.forEach(function (item, i) {
      var mine = state.answers[i];
      var ok = mine === item.correct;
      var d = document.createElement("div");
      d.className = "revitem " + (ok ? "right" : "wrong");
      var qn = document.createElement("div");
      qn.className = "qnum"; qn.textContent = (i + 1) + " · " + t("badge." + typeKey(item.q));
      d.appendChild(qn);
      var qq = document.createElement("div"); qq.className = "revq"; qq.textContent = item.q.question;
      d.appendChild(qq);
      var src = signSrc(item.q);
      if (src) {
        var sw = document.createElement("div"); sw.className = "revsign";
        var im = document.createElement("img"); im.src = src; im.alt = "";
        sw.appendChild(im); d.appendChild(sw);
      }
      item.answers.forEach(function (a, k) {
        var row = document.createElement("div");
        var mark = "·";
        if (k === item.correct) { row.className = "reva correct"; mark = "✓"; }
        else if (k === mine) { row.className = "reva chosen-wrong"; mark = "✕"; }
        else { row.className = "reva plain"; }
        row.innerHTML = '<span class="mark">' + mark + '</span><span></span>';
        row.lastChild.textContent = a;
        d.appendChild(row);
      });
      if (mine === null) {
        var sk = document.createElement("div"); sk.className = "reva chosen-wrong";
        sk.innerHTML = '<span class="mark">—</span><span>' + t("skipped") + "</span>";
        d.appendChild(sk);
      }
      rl.appendChild(d);
    });
    window.scrollTo({ top: 0 });
  }

  el("startbtn").onclick = startExam;
  el("prevbtn").onclick = function () { if (state.idx > 0) { state.idx--; renderQ(); } };
  el("nextbtn").onclick = next;
  el("againbtn").onclick = goHome;
  el("homebtn").onclick = goHome;
  document.addEventListener("keydown", function (e) {
    if (el("screen-quiz").classList.contains("hidden")) return;
    if (e.key >= "1" && e.key <= "3") { state.answers[state.idx] = +e.key - 1; renderQ(); }
    else if (e.key === "ArrowRight" && document.documentElement.dir !== "rtl") next();
    else if (e.key === "ArrowLeft" && document.documentElement.dir === "rtl") next();
  });

  renderStart();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
